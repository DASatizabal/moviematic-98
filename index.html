<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieMatic 98</title>
<meta name="description" content="A Windows 98 style movie night picker for family movie night.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000080'/><rect x='3' y='5' width='10' height='7' fill='%2333ff66'/></svg>">
</head>
<body>

<div class="window" role="application" aria-label="MovieMatic 98">

  <div class="title-bar">
    <div class="title-bar-text">
      <span class="title-bar-icon" aria-hidden="true"></span>
      MovieMatic 98
    </div>
    <div class="title-bar-controls" aria-hidden="true">
      <span class="tb-btn tb-min"></span>
      <span class="tb-btn tb-max"></span>
      <span class="tb-btn tb-close"></span>
    </div>
  </div>

  <div class="menu-bar" role="presentation">
    <span class="menu-item"><u>F</u>ile</span>
    <span class="menu-item"><u>V</u>iew</span>
    <span class="menu-item"><u>S</u>nacks</span>
    <span class="menu-item"><u>H</u>elp</span>
  </div>

  <div class="window-body">
    <div class="columns">

      <section class="pane pane-list" aria-labelledby="list-legend">
        <h2 class="pane-label" id="list-legend">Available Titles</h2>
        <div class="listbox" id="listbox" role="listbox" aria-labelledby="list-legend" tabindex="-1">
          <p class="listbox-loading" id="listbox-loading">Loading movies.json&hellip;</p>
        </div>
      </section>

      <section class="pane pane-crt" aria-labelledby="crt-legend">
        <h2 class="pane-label" id="crt-legend">Tonight's Feature</h2>

        <div class="crt" id="crt">
          <div class="crt-inner">
            <p class="crt-kicker" id="crt-kicker">SELECTION</p>
            <p class="crt-title" id="crt-title">READY<span class="caret" id="caret">_</span></p>
            <p class="crt-meta" id="crt-meta"></p>
            <p class="crt-hook" id="crt-hook"></p>
          </div>
          <div class="scanlines" aria-hidden="true"></div>
          <div class="crt-live" id="crt-live" role="status" aria-live="polite"></div>
        </div>

        <label class="check-row" for="skip-watched">
          <input type="checkbox" id="skip-watched">
          <span>Skip titles already watched</span>
        </label>

        <div class="button-row">
          <button type="button" class="btn btn-primary" id="btn-pick">Pick for me</button>
          <button type="button" class="btn" id="btn-watched">Mark watched</button>
          <button type="button" class="btn" id="btn-reset">Reset</button>
        </div>
      </section>

    </div>
  </div>

  <div class="status-bar">
    <div class="status-cell" id="status-titles">0 titles</div>
    <div class="status-cell" id="status-watched">0 watched</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
